
name: Sync PhotoCraft Upstream

on:
  schedule:
    # Chạy mỗi ngày lúc 03:00 UTC (10:00 giờ Việt Nam)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-photocraft-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh repo sync "$REPOSITORY" \
            --source storytold/photocraft \
            --branch main \
            --force
